services:
  k6:
    image: grafana/k6:latest
    container_name: optical-k6
    profiles: ["k6"]
    network_mode: host
    environment:
      BASE_URL: ${K6_BASE_URL:-http://localhost:8000}
      K6_EMAIL: ${K6_EMAIL:-admin@optical.com}
      K6_PASSWORD: ${K6_PASSWORD:-password}
    volumes:
      - ./tests/k6:/scripts
      - ./reports:/reports
    command: run /scripts/smoke-test.js
