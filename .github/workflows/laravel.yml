name: Laravel CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: optical_crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo, pdo_mysql, xml, curl, zip, gd
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Copy .env
        run: cp .env.example .env

      - name: Configure MySQL for tests
        run: |
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=optical_crm_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get npm cache directory
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do
            sleep 2
          done

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Pint (Laravel coding style)
        run: vendor/bin/pint --test

      - name: Run tests with Pest
        run: php artisan test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy Docker containers
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

      - name: Wait for MySQL
        run: sleep 10

      - name: Run database migrations
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan migrate --force

      - name: Optimize application
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan config:cache
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan route:cache
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T app php artisan view:cache
