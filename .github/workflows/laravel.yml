name: Laravel CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: optical_crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo, pdo_mysql, xml, curl, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get npm cache directory
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Configure environment
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=optical_crm_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do
            sleep 2
          done

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          set -e

          DEPLOY_DIR="/opt/optical-crm"

          # First deployment: clone if directory doesn't exist
          if [ ! -d "$DEPLOY_DIR/.git" ]; then
            echo "Deploy directory $DEPLOY_DIR does not exist. Cloning..."
            sudo mkdir -p "$DEPLOY_DIR"
            sudo chown -R "$USER" "$DEPLOY_DIR"
            git clone https://github.com/mohamedait-abbou/optical-management-system.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"

          # Pull latest code
          git fetch origin main
          git checkout -f origin/main
          git branch -f main origin/main

          # A valid .env is required. If missing, copy from the example and
          # fill in DB credentials. Do NOT regenerate APP_KEY: it must stay
          # stable so sessions and encrypted data keep working.
          if [ ! -f .env ]; then
            echo "Creating .env from example..."
            cp .env.example .env
            sed -i \
              -e 's|^APP_ENV=.*|APP_ENV=production|' \
              -e 's|^APP_DEBUG=.*|APP_DEBUG=false|' \
              -e 's|^DB_CONNECTION=.*|DB_CONNECTION=mysql|' \
              -e 's|^# DB_HOST=.*|DB_HOST=mysql|' \
              -e 's|^# DB_PORT=.*|DB_PORT=3306|' \
              -e 's|^# DB_DATABASE=.*|DB_DATABASE=optical_crm|' \
              -e 's|^# DB_USERNAME=.*|DB_USERNAME=optical_user|' \
              -e 's|^# DB_PASSWORD=.*|DB_PASSWORD=optical_password|' \
              -e 's|^DB_ROOT_PASSWORD=.*|DB_ROOT_PASSWORD=root|' \
              -e 's|^SESSION_DRIVER=.*|SESSION_DRIVER=database|' \
              -e 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=database|' \
              -e 's|^CACHE_STORE=.*|CACHE_STORE=database|' \
              -e 's|^MAIL_HOST=.*|MAIL_HOST=mailpit|' \
              .env
          fi

          # Build and start containers from the standalone production compose file
          echo "Building and starting containers (this may take a few minutes)..."
          docker compose -f docker-compose.prod.yml up -d --build

          # Wait for the app healthcheck
          echo "Waiting for the app to become healthy..."
          RETRIES=30
          until [ "$(docker inspect -f '{{.State.Health.Status}}' optical-crm 2>/dev/null)" = "healthy" ]; do
            RETRIES=$((RETRIES - 1))
            if [ $RETRIES -le 0 ]; then
              echo "Application did not become healthy in time."
              docker compose -f docker-compose.prod.yml logs --tail=50 app
              exit 1
            fi
            sleep 2
          done
          echo "Application is healthy."

          # Run database migrations
          echo "Running migrations..."
          docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force

          # Clear and rebuild cache
          echo "Optimizing..."
          docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
          docker compose -f docker-compose.prod.yml exec -T app php artisan optimize

          echo "Deployment finished successfully."
