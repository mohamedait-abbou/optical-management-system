name: Laravel CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: optical_crm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: mbstring, pdo, pdo_mysql, xml, curl, gd, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get npm cache directory
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Configure environment
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=optical_crm_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do
            sleep 2
          done

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  deploy:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          set -e

          DEPLOY_DIR="/home/mhd/CRM_optical"

          # First deployment: clone if directory doesn't exist
          if [ ! -d "$DEPLOY_DIR" ]; then
            echo "Directory $DEPLOY_DIR does not exist. Cloning..."
            git clone https://github.com/mohamedait-abbou/optical-management-system.git "$DEPLOY_DIR"
          fi

          cd "$DEPLOY_DIR"

          # Pull latest code
          git fetch origin
          git reset --hard origin/main

          # Ensure .env exists with required MySQL variables
          if [ ! -f .env ]; then
            echo "Creating .env for production..."
            printf '%s\n' \
              'APP_NAME=Optical CRM' \
              'APP_ENV=production' \
              'APP_KEY=' \
              'APP_DEBUG=false' \
              'APP_URL=http://localhost' \
              '' \
              'DB_CONNECTION=mysql' \
              'DB_HOST=mysql' \
              'DB_PORT=3306' \
              'DB_DATABASE=optical_crm' \
              'DB_USERNAME=optical_user' \
              'DB_PASSWORD=secret' \
              'DB_ROOT_PASSWORD=root_secret' \
              '' \
              'SESSION_DRIVER=database' \
              'SESSION_LIFETIME=120' \
              'BROADCAST_CONNECTION=log' \
              'FILESYSTEM_DISK=local' \
              'QUEUE_CONNECTION=database' \
              'CACHE_STORE=database' \
              'LOG_CHANNEL=stack' \
              'LOG_LEVEL=warning' \
              'MAIL_MAILER=log' \
              > .env
            echo "WARNING: .env was created. Update DB_PASSWORD and DB_ROOT_PASSWORD for security."
          fi

          # Install dependencies on the host (faster, uses OS cache)
          echo "Installing PHP dependencies..."
          composer install --no-interaction --prefer-dist --no-progress --no-dev

          # Generate APP_KEY if empty (needs vendor/ installed first)
          if grep -q '^APP_KEY=$' .env; then
            php artisan key:generate
          fi

          echo "Installing npm dependencies..."
          npm ci

          echo "Building frontend assets..."
          npm run build

          # Stop existing containers
          echo "Stopping existing containers..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans || true

          # Build and start containers
          # Dockerfile now only packages pre-built code, so build is fast
          echo "Building and starting containers..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

          # Wait for MySQL healthcheck (defined in docker-compose.yml)
          echo "Waiting for MySQL to be ready..."
          RETRIES=30
          until docker compose exec -T mysql mysqladmin ping --silent 2>/dev/null; do
            RETRIES=$((RETRIES - 1))
            if [ $RETRIES -le 0 ]; then
              echo "MySQL did not become ready in time."
              exit 1
            fi
            sleep 2
          done
          echo "MySQL is ready."

          # Run database migrations
          echo "Running migrations..."
          docker compose exec -T app php artisan migrate --force

          # Clear and rebuild cache
          echo "Optimizing..."
          docker compose exec -T app php artisan optimize:clear
          docker compose exec -T app php artisan optimize

          echo "Deployment finished successfully."
